name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @webmcp-schemas/lint exec playwright install --with-deps chromium

      # Build first - see the comment in ci.yml: packages/runtime and
      # storefront-demo resolve @webmcp-schemas/schemas via its built dist/
      # output, which doesn't exist on a fresh checkout.
      - run: pnpm run build

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test

      # The `secrets` context can't be referenced directly in an `if:`
      # condition (GitHub Actions rejects the workflow file entirely if you
      # try - caught by actionlint, not by plain YAML validation). Route it
      # through env: on a run step instead (secrets ARE allowed in env:),
      # writing only a derived true/false to GITHUB_OUTPUT - never the
      # secret value itself - then gate the next step on that output.
      - name: Check whether NPM_TOKEN is set
        id: check_npm_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      # changesets/action's publish step tries to publish any package
      # version not yet in the npm registry on every push to master,
      # regardless of whether a changeset exists - not just when a
      # "Version Packages" PR is merged. Without this guard, every push
      # fails loudly with a 404 until NPM_TOKEN is actually set. Skip the
      # whole step until that secret exists, rather than failing on every
      # commit in the meantime.
      - name: Create release PR or publish to npm
        if: steps.check_npm_token.outputs.has_token == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
