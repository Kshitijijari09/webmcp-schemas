name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @webmcp-schemas/lint exec playwright install --with-deps chromium

      # Build first: packages/runtime and storefront-demo resolve
      # @webmcp-schemas/schemas via its built dist/ output (declared
      # types/exports), which doesn't exist yet on a fresh checkout. Running
      # typecheck/coverage before build fails with "Cannot find module
      # '@webmcp-schemas/schemas'" - verified by reproducing locally with a
      # clean tree (no dist/ anywhere).
      - run: pnpm run build

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run coverage
