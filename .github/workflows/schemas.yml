name: Validate canonical schemas

on:
  push:
    branches: [master]
    paths:
      - 'packages/schemas/src/schemas/**'
  pull_request:
    paths:
      - 'packages/schemas/src/schemas/**'

concurrency:
  group: schemas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate every canonical file against the meta-schema
        run: pnpm --filter @webmcp-schemas/schemas run test

      - name: Require a version bump on any changed stable file
        if: github.event_name == 'pull_request'
        env:
          SCHEMAS_CHECK_BASE_REF: origin/${{ github.base_ref }}
        run: node packages/schemas/scripts/check-stable-version-bump.mjs
